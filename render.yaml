# Render Blueprint: New -> Blueprint -> pick this repo. Render builds everything
# from this file and asks only for the values marked `sync: false` (secrets).
services:
  - type: web
    name: tradesys
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /_stcore/health
    disk:
      name: tradesys-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Tenants that trade automatically on a fresh disk, until someone toggles
      # automation in the dashboard (an explicit choice there always wins).
      - key: TRADESYS_AUTORUN
        value: demo_showcase,tal_dahan
      - key: TRADESYS_CYCLE_MINUTES
        value: "15"
      - key: TRADESYS_ADMIN_PASSCODE
        sync: false
      - key: TRADESYS_VAULT_KEY
        sync: false
      - key: TRADESYS_FINNHUB_API_KEY
        sync: false
      - key: TRADESYS_MARKET_DATA__KEY_ID
        sync: false
      - key: TRADESYS_MARKET_DATA__SECRET_KEY
        sync: false
