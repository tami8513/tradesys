# Tenant profile. Contains NO secrets — only the *name* of the env vars holding them.
client_id: tal_dahan
display_name: Tal Dahan (personal)
timeframe: 1Day
lookback_bars: 180
max_candidates_per_cycle: 4
memory_top_k: 5
monitor_interval_seconds: 30      # how often PositionMonitor polls open positions
max_holding_days: null            # leaders are held while the trend holds; the trail exits
tags: [founder, leaders_momentum]

# צייד המובילות: בכל שבוע בוחרים את 8 החזקות ביותר מתוך המאגר המאושר
# (חברות גדולות וקרנות סקטור), והרובוט סוחר רק בהן. שומר הסיכון חוסם כל
# מניה מחוץ למאגר.
universe: leaders
universe_setups: [trend_continuation, pullback]
leaders_count: 8
# סטופ רחב (3 ATR) שמחזיק מגמה ארוכה; בבדיקה ההיסטורית סטופ צר נקטע ברעש.
stop_atr_multiple: 3.0
# הרמה הגבוהה ביותר במד הסיכון שהלקוח רשאי לבחור. 4-5 חורגות משמירת הקרן.
max_risk_level: 5

broker:
  name: alpaca           # paper | alpaca
  paper: true            # Alpaca's paper account: real order handling, simulated money
  # Reads TRADESYS_MARKET_DATA__KEY_ID / __SECRET_KEY: the platform's Alpaca paper
  # keys, used by this one tenant only. A second client needs keys of its own.
  credential_ref: TRADESYS_MARKET_DATA

risk:
  max_drawdown_pct: 2.0        # peak-to-current equity; a breach latches a halt
  max_daily_loss_pct: 1.5
  risk_per_trade_pct: 0.5      # equity risked between entry and stop
  max_position_pct: 12.0       # notional cap per position
  max_open_positions: 8
  max_trades_per_day: 3
  min_reward_risk: 2.0
  allow_short: false
  allow_leverage: false
  min_price: 1.0
  max_position_pct_of_adv: 0.02
  forbidden_setups: []

  # סטופ מבוסס ATR לא שורד גאפ של דוח — חוסמים כניסה בחלון שלפניו.
  # סימבול ללא תאריך ידוע ב-earnings.yaml ייחסם גם הוא, במכוון.
  avoid_earnings_within_days: 3
  # 3 ימים לפני דוח רבעוני מוכרים חצי מהפוזיציה, פעם אחת לכל דוח: הסטופ לא
  # מגן מפתיחה בגאפ אחרי דוח, וחצי פוזיציה הוא חצי מההפסד הזה.
  earnings_trim_days: 3

  # פילטר משטר שוק: פריצות נחסמות כשה-SPY מתחת לממוצע 200 שלו.
  regime_symbol: SPY
  regime_sma_period: 200
  regime_blocked_setups: [breakout]

  # סטופ נגרר: ב-+1R הסטופ עולה לנקודת הכניסה ואז עוקב אחרי השיא במרחק 1R.
  # הסטופ רק עולה, אף פעם לא יורד.
  trailing_stop: true
  trail_activation_r: 1.0
  trail_distance_r: 1.0
  # ביעד: נשארים בעסקה אם המגמה עדיין עולה, ונועלים לפחות חצי מרווח היעד.
  let_winners_run: true
  # סוכן התקפה: תבנית מוכחת מקבלת 100% מתקרת הסיכון, חדשה 75%, מפסידה 50%.
  conviction_sizing: true

  # סוכן פיזור: עד 40% מהתיק בענף אחד, וחסימת מניה שזזה כמעט כמו מניה
  # שכבר מוחזקת (מתאם תשואות יומיות 0.85 ומעלה) - אותו הימור פעמיים.
  max_sector_pct: 40
  max_correlation: 0.85
