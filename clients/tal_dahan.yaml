# Tenant profile. Contains NO secrets — only the *name* of the env vars holding them.
client_id: tal_dahan
display_name: Tal Dahan (personal)
timeframe: 1Day
lookback_bars: 180
max_candidates_per_cycle: 4
memory_top_k: 5
monitor_interval_seconds: 30      # how often PositionMonitor polls open positions
max_holding_days: 10              # time stop; omit or null to disable
tags: [founder, small_cap_momentum]

broker:
  name: paper            # paper | alpaca
  paper: true
  # Reads TRADESYS__TAL_DAHAN__ALPACA__KEY_ID / __SECRET_KEY when name is alpaca.
  credential_ref: TRADESYS__TAL_DAHAN__ALPACA

risk:
  max_drawdown_pct: 2.0        # peak-to-current equity; a breach latches a halt
  max_daily_loss_pct: 1.5
  risk_per_trade_pct: 0.5      # equity risked between entry and stop
  max_position_pct: 12.0       # notional cap per position
  max_open_positions: 5
  max_trades_per_day: 3
  min_reward_risk: 2.0
  allow_short: false
  allow_leverage: false
  min_price: 1.0
  max_position_pct_of_adv: 0.02
  forbidden_setups: []

watchlist:
  - symbol: KULR
    setups: [breakout, pullback]
    max_position_pct: 6.0
    notes: high volatility small cap; halved position cap
  - symbol: SPCE
    setups: [oversold_reversal]
    max_position_pct: 5.0
    notes: news-driven; reversals only
  - symbol: RIVN
    setups: [breakout, pullback, trend_continuation]
  - symbol: LFWD
    setups: [oversold_reversal]
    max_position_pct: 4.0
  - symbol: BBLG
    setups: [breakout]
    max_position_pct: 3.0
    notes: thin liquidity; smallest cap on the book
  - symbol: SQQQ
    setups: [trend_continuation]
    max_position_pct: 8.0
    notes: inverse leveraged ETF, hedge sleeve only
