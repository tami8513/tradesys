[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradesys"
version = "0.1.0"
description = "Multi-tenant, agentic trading framework with a human-in-the-loop reflection engine"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
broker = ["httpx>=0.27"]
chroma = ["chromadb>=0.5"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]
dashboard = ["streamlit>=1.63,<2", "plotly>=5.24", "pandas>=2.2", "cryptography>=42", "httpx>=0.27"]

[project.scripts]
tradesys = "tradesys.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 95
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
